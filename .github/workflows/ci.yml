name: CI / Automated Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Test Suite & Concurrency Simulations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite (28 Tests)
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v

      - name: Run Architecture Benchmark Verification
        env:
          PYTHONPATH: .
        run: |
          python benchmarks/run_benchmark.py
